name: Build and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set login-gate secrets on the worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            secret put BIRTHDAY_ACCESS_NAME --name hbdzaini <<< "${{ secrets.BIRTHDAY_ACCESS_NAME }}"
            secret put BIRTHDAY_ACCESS_DOB --name hbdzaini <<< "${{ secrets.BIRTHDAY_ACCESS_DOB }}"
            secret put BIRTHDAY_SESSION_SECRET --name hbdzaini <<< "${{ secrets.BIRTHDAY_SESSION_SECRET }}"
